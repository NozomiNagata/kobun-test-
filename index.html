<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;line-height:1.58}main{max-width:850px;margin:auto;padding:20px 15px 75px}

accent);margin:5px 0 0;flex-shrink:0}.answerbox{border-radius:9px;padding:12px 13px;margin-top:12px}.right{background:#edf8f3;border-left:4px solid var(--good)}.wrong{background:#fff1ee;border-left:4px solid var(--bad)}.answerbox p{margin:5px 0}.exp{background:#fff;border:1px solid #ecc9c0;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:14px}.inp{font:inherit;min-height:43px;width:100%;padding:9px 11px;border:1px solid #adbec8;border-radius:9px;background:#fff}.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}.check input{width:18px;height:18px;accent-color:var(--accent)}.rule{border-top:1px solid var(--line);padding-top:14px;margin-top:15px}.notice{font-size:13px;line-height:1.6;border:1px solid var(--line);border-radius:11px;background:#fff;padding:12px 14px}.caption{font-size:12px;color:var(--muted)}.badtext{color:var(--bad)}.goodtext{color:var(--good)}.hidden{display:none !important}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);max-width:90vw;background:#193541;color:white;border-radius:9px;padding:10px 15px;display:none;box-shadow:0 2px 18px #0002;z-index:20}.toggle{color:var(--accent);background:transparent;border:none;padding:6px 0;font-size:14px}.historyitem{border-top:1px solid var(--line);padding:9px 0;font-size:14px}.headingline{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.06em}select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:15px}@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:14px}.qtitle{font-size:16px}main{padding:14px 12px 70px}.flex button{flex-grow:1}.metric b{font-size:24px}}@media print{body{background:white}button,.noshow{display:none!important}.card{break-inside:avoid;box-shadow:none}}

<body><main><header><div class="headingline">古文・文学史｜P319〜329</div><h1>100問トレーナー</h1><p class="sub">1回10問（選択6・記述4）／2分／自動採点／苦手を繰り返し</p></header><div id="screen"></div><p class="caption">出題の根拠：添付された文学史資料P319〜329。解説は正解・不正解のどちらでも採点後に表示されます。学習履歴はこのブラウザ内に保存されます。</p></main><div id="toast"></div><script>
'use strict';
const QUESTIONS = [{"id":"M027","type":"mc","q":"『源氏物語』と成立時期が近い勅撰和歌集はどれか。","options":["新古今和歌集","拾遺和歌集","金葉和歌集","古今和歌集"],"answer":"拾遺和歌集","why":"『源氏物語』は11世紀初め、『拾遺和歌集』も11世紀初めごろ。『古今和歌集』は約100年前。","priority":"normal"},{"id":"M031","type":"mc","q":"『和泉式部日記』の作者は誰か。","options":["菅原孝標女","和泉式部","藤原道綱母","赤染衛門"],"answer":"和泉式部","why":"『和泉式部日記』は和泉式部の作。『更級日記』は菅原孝標女。","priority":"normal"},{"id":"M058","type":"mc","q":"『雨月物語』の作者は誰か。","options":["上田秋成","滝沢馬琴","十返舎一九","与謝蕪村"],"answer":"上田秋成","why":"『雨月物語』は上田秋成の読本。『南総里見八犬伝』は滝沢馬琴の読本。","priority":"normal"},{"id":"W014","type":"written","q":"「物語の祖」とされる、かぐや姫を主人公とする平安前期の物語を答えよ。","answer":"竹取物語","aliases":[],"why":"『竹取物語』は作り物語。『伊勢物語』は歌物語。","priority":"good"},{"id":"W016","type":"written","q":"『源氏物語』の作者を漢字で答えよ。","answer":"紫式部","aliases":[],"why":"『源氏物語』は全54帖。紫式部は中宮彰子に仕えた。","priority":"normal"},{"id":"W019","type":"written","q":"『和泉式部日記』の作者を答えよ。","answer":"和泉式部","aliases":[],"why":"和泉式部は平安中期の女流歌人。日記作品も伝わる。","priority":"normal"},{"id":"W020","type":"written","q":"『古今和歌集』の仮名序を執筆した撰者を答えよ。","answer":"紀貫之","aliases":[],"why":"紀貫之は『土佐日記』の作者でもある。","priority":"good"},{"id":"W021","type":"written","q":"『金槐和歌集』を著した鎌倉幕府三代将軍の名を答えよ。","answer":"源実朝","aliases":[],"why":"『金槐和歌集』は源実朝の私家集。西行の私家集は『山家集』。","priority":"good"},{"id":"W024","type":"written","q":"『方丈記』の作者を漢字で答えよ。","answer":"鴨長明","aliases":[],"why":"鎌倉時代の随筆。『徒然草』は兼好法師。","priority":"good"},{"id":"W029","type":"written","q":"鎌倉時代後期〜南北朝期に成立し、「四鏡」の最後に当たる歴史物語を答えよ。","answer":"増鏡","aliases":[],"why":"四鏡は大鏡・今鏡・水鏡・増鏡。『増鏡』は鎌倉期の歴史を扱う。","priority":"good"},{"id":"W032","type":"written","q":"『新撰菟玖波集』の撰者を答えよ。","answer":"飯尾宗祇","aliases":[],"why":"「新撰」がある方は飯尾宗祇。「新撰」がない『菟玖波集』は二条良基。","priority":"good"},{"id":"W033","type":"written","q":"能楽論書『風姿花伝』の作者を答えよ。","answer":"世阿弥","aliases":[],"why":"世阿弥は能を大成した人物。『風姿花伝』は能楽論書。","priority":"good"},{"id":"W034","type":"written","q":"俳諧紀行文『奥の細道』の作者を答えよ。","answer":"松尾芭蕉","aliases":[],"why":"『奥の細道』の作者は松尾芭蕉。『笈の小文』も芭蕉による俳諧紀行文。","priority":"normal"},{"id":"W040","type":"written","q":"江戸時代の俳人で、『新花摘』の作者を答えよ。","answer":"与謝蕪村","aliases":[],"why":"『新花摘』は与謝蕪村の俳諧作品。『奥の細道』の松尾芭蕉と区別する。","priority":"good"},{"type":"mc","q":"『古事記』の成立時代として適切なものはどれか。","options":["奈良時代","平安時代","鎌倉時代","室町時代"],"answer":"奈良時代","why":"『古事記』は712年に成立した現存最古の書物。 年表上では奈良時代に位置する。","priority":"good","id":"M061"},{"type":"mc","q":"『日本書紀』の成立時代として適切なものはどれか。","options":["平安時代","鎌倉時代","室町時代","奈良時代"],"answer":"奈良時代","why":"『日本書紀』は720年に成立した日本最初の正史。 年表上では奈良時代に位置する。","priority":"good","id":"M062"},{"type":"mc","q":"『万葉集』の成立時代として適切なものはどれか。","options":["鎌倉時代","室町時代","奈良時代","平安時代"],"answer":"奈良時代","why":"『万葉集』は8世紀の代表的な和歌集。 年表上では奈良時代に位置する。","priority":"good","id":"M063"},{"type":"mc","q":"『懐風藻』の成立時代として適切なものはどれか。","options":["室町時代","奈良時代","平安時代","鎌倉時代"],"answer":"奈良時代","why":"『懐風藻』は751年に成立した漢詩集。 年表上では奈良時代に位置する。","priority":"good","id":"M064"},{"type":"mc","q":"『日本霊異記』の成立時代として適切なものはどれか。","options":["奈良時代","平安時代","鎌倉時代","室町時代"],"answer":"平安時代","why":"『日本霊異記』は9世紀初めの説話集。 年表上では平安時代に位置する。","priority":"good","id":"M065"},{"type":"mc","q":"『古今和歌集』の成立時代として適切なものはどれか。","options":["平安時代","鎌倉時代","室町時代","奈良時代"],"answer":"平安時代","why":"『古今和歌集』は905年ごろ成立した最初の勅撰和歌集。 年表上では平安時代に位置する。","priority":"good","id":"M066"},{"type":"mc","q":"『竹取物語』の成立時代として適切なものはどれか。","options":["鎌倉時代","室町時代","奈良時代","平安時代"],"answer":"平安時代","why":"『竹取物語』は平安前期の作り物語。 年表上では平安時代に位置する。","priority":"good","id":"M067"},{"type":"mc","q":"『土佐日記』の成立時代として適切なものはどれか。","options":["室町時代","奈良時代","平安時代","鎌倉時代"],"answer":"平安時代","why":"『土佐日記』は935年ごろ成立した紀貫之の日記。 年表上では平安時代に位置する。","priority":"good","id":"M068"},{"type":"mc","q":"『伊勢物語』の成立時代として適切なものはどれか。","options":["奈良時代","平安時代","鎌倉時代","室町時代"],"answer":"平安時代","why":"『伊勢物語』は平安前期の歌物語。 年表上では平安時代に位置する。","priority":"good","id":"M069"},{"type":"mc","q":"『源氏物語』の成立時代として適切なものはどれか。","options":["平安時代","鎌倉時代","室町時代","奈良時代"],"answer":"平安時代","why":"『源氏物語』は11世紀初め、紫式部の作り物語。 年表上では平安時代に位置する。","priority":"good","id":"M070"},{"type":"mc","q":"『枕草子』の成立時代として適切なものはどれか。","options":["鎌倉時代","室町時代","奈良時代","平安時代"],"answer":"平安時代","why":"『枕草子』は11世紀初め、清少納 る。","priority":"good","id":"M082"},{"type":"mc","q":"『奥の細道』の成立時代として適切なものはどれか。","options":["室町時代","江戸時代","平安時代","鎌倉時代"],"answer":"江戸時代","why":"『奥の細道』は17世紀末の松尾芭蕉の俳諧紀行文。 年表上では江戸時代に位置する。","priority":"good","id":"M083"},{"type":"mc","q":"『雨月物語』の成立時代として適切なものはどれか。","options":["江戸時代","奈良時代","平安時代","室町時代"],"answer":"江戸時代","why":"『雨月物語』は18世紀後半に刊行された上田秋成の読本。 年表上では江戸時代に位置する。","priority":"good","id":"M084"},{"type":"mc","q":"『東海道中膝栗毛』の成立時代として適切なものはどれか。","options":["平安時代","鎌倉時代","室町時代","江戸時代"],"answer":"江戸時代","why":"『東海道中膝栗毛』は19世紀初めから刊行された滑稽本。 年表上では江戸時代に位置する。","priority":"good","id":"M085"},{"type":"mc","q":"『南総里見八犬伝』の成立時代として適切なものはどれか。","options":["平安時代","室町時代","江戸時代","奈良時代"],"answer":"江戸時代","why":"『南総里見八犬伝』は19世紀の滝沢馬琴による読本。 年表上では江戸時代に位置する。","priority":"good","id":"M086"},{"type":"mc","q":"『懐風藻』が成立・刊行したのは、おおむね何世紀か。","options":["8世紀","9世紀","6世紀","7世紀"],"answer":"8世紀","why":"751年成立。奈良時代の漢詩集。","priority":"good","id":"M087"},{"type":"mc","q":"『古今和歌集』が成立・刊行したのは、おおむね何世紀か。","options":["11世紀","8世紀","9世紀","10世紀"],"answer":"10世紀","why":"905年ごろ。平安前期の勅撰和歌集。","priority":"good","id":"M088"},{"type":"mc","q":"『土佐日記』が成立・刊行したのは、おおむね何世紀か。","options":["8世紀","9世紀","10世紀","11世紀"],"answer":"10世紀","why":"935年ごろ。紀貫之の仮名日記。","priority":"good","id":"M089"},{"type":"mc","q":"『源氏物語』が成立・刊行したのは、おおむね何世紀か。","options":["10世紀","11世紀","12世紀","9世紀"],"answer":"11世紀","why":"11世紀初め。紫式部が著した物語。","priority":"good","id":"M090"},{"type":"mc","q":"『枕草子』が成立・刊行したのは、おおむね何世紀か。","options":["11世紀","12世紀","9世紀","10世紀"],"answer":"11世紀","why":"11世紀初め。清少納言の随筆。","priority":"good","id":"M091"},{"type":"mc","q":"『更級日記』が成立・刊行したのは、おおむね何世紀か。","options":["12世紀","9世紀","10世紀","11世紀"],"answer":"11世紀","why":"11世紀半ば。菅原孝標女の日記。","priority":"good","id":"M092"},{"type":"mc","q":"『今昔物語集』が成立・刊行したのは、おおむね何世紀か。","options":["10世紀","11世紀","12世紀","13世紀"],"answer":"12世紀","why":"12世紀初めごろの説話集。","priority":"good","id":"M093"},{"type":"mc","q":"『新古今和歌集』が成立・刊行したのは、おおむね何世紀か。","options":["12世紀","13世紀","14世紀","11世紀"],"answer":"13世紀","why":"1205年ごろの勅撰和歌集。","priority":" const KEY='kobun100v1';
const S=(k,def)=>{try{const x=JSON.parse(localStorage.getItem(k));return x??def}catch{return def}};
const fresh=()=>({version:1,done:{},missed:{},flagged:{},recent:[],history:[],round:0,mode:'normal',timer:true});
let state={...fresh(),...S(KEY,fresh())};
// 2026-11-17: retire previously mastered question IDs without losing exam history.
// New questions have new IDs; archivedDone keeps the previous achievements.
const ACTIVE_IDS=new Set(QUESTIONS.map(q=>q.id));
function migrateQuestionBank(st){
 st.archivedDone=st.archivedDone||{};
 for(const id of Object.keys(st.done||{}))if(!ACTIVE_IDS.has(id)){st.archivedDone[id]=st.done[id];delete st.done[id]}
 for(const key of ['missed','flagged'])for(const id of Object.keys(st[key]||{}))if(!ACTIVE_IDS.has(id))delete st[key][id];
 st.bankVersion=2;
 return st;
}
state=migrateQuestionBank(state);
try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}
let current=null; let clockTimer=null; let secondsLeft=120; let timerDeadline=0;
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=x=>String(x||'').normalize('NFKC').replace(/[\s\u3000・･「」『』（）()]/g,'').trim();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
const btn=(txt,func,cls='')=>`<button type="button" class="${cls}" data-cmd="${func}">${txt}</button>`;
const n=x=>Object.keys(x).length;
const qby=id=>QUESTIONS.find(x=>x.id===id);
const reviewIds=()=>new Set([...Object.keys(state.missed),...Object.keys(state.flagged)]);
const stats=()=>({done:n(state.done),wrong:reviewIds().size,missed:n(state.missed),flagged:n(state.flagged),total:QUESTIONS.length});
function toast(msg){const el=$('toast');el.textContent=msg;el.style.display='block';setTimeout(()=>{el.style.display='none'},2500)}
function stopClock(){if(clockTimer){clearInterval(clockTimer);clockTimer=null}}
function tick(){if(!current||current.graded||!state.timer)return;secondsLeft=Math.max(0,Math.ceil((timerDeadline-Date.now())/1000));const el=$('clock');if(el){el.textContent=Math.floor(secondsLeft/60)+':'+String(secondsLeft%60).padStart(2,'0');el.classList.toggle('warn',secondsLeft<=30)}if(secondsLeft<=0){stopClock();grade(true)}}
function header(){const st=stats();return `<div class="grid"><div class="metric"><b>${st.done}<small> / 100</small></b><small>現行100問で正解済み</small></div><div class="metric"><b>${st.wrong}</b><small>復習リスト</small></div><div class="metric"><b>${st.missed}</b><small>まだ解き直していない誤答</small></div><div class="metric"><b>${state.history.length}</b><small>受験セット数（旧問題含む）</small></div></div><div class="meter"><div class="bar" style="width:${st.done}%"></div></div>`}
function dashboard(){stopClock();current=null;const st=stats();const last=state.history.slice(-3).reverse();$('screen').innerHTML=header()+`<section class="card"><h2>${st.done===100&&st.wrong===0?'100問達成！おめでとう！':'10問ずつ進めよう'}</h2><p class="muted">${n(state.archivedDone||{})?`前回の正解済み${n(state.archivedDone)}問は出題対象から外し、新問題に交換しました。`:'新しい問題集です。'}過去の受験記録はそのまま残ります。まずは未正解の問題を優先し、復習リストからも出題します。復習リストは現在<strong>${st.wrong}問</strong>。</p><div class="flex" style="margin:16px 0">${btn('新しい10問を開始','new')}${btn('復習中心で10問','review','secondary')}${btn('復習リストを見る','list','ghost')}</div><label class="check"><input type="checkbox" id="timerEnabled" ${state.timer?'checked':''}>2分タイマーを使う（時間切れで自動採点）</label></section><section class="card"><h3>このアプリの採点ルール</h3><p class="muted">正解・不正解のどちらも、採点後に答えと解説を表示します。不正解は自動で復習リストに登録します。正解した問題も「怪しいので復習」で手動登録可能。復習問題を正解し、自信ありにしたらリストから外れます。</p><p class="muted">回答を空欄にすると不正解です。記述は空白や一部の記号の違いは無視しますが、正しい漢字が必要です。</p></section><section class="card"><h3>最近の結果</h3>${last.length?last.map(x=>`<div class="historyitem">第${x.round}セット：<b>${x.score}/10</b>点 · 誤答${x.missed}問 · ${esc(x.date)}</div>`).join(''):'<p class="muted">まだ受験履歴がありません。</p>'}<div class="rule flex">${btn('履歴を書き出す','export','secondary tiny')}${btn('履歴を読み込む','import','ghost tiny')}<input type="file" accept="application/json" id="importfile" class="hidden"><span class="caption">端末変更やブラウザのデータ消去に備えて保存できます。</span></div></section>`;bindCommon();$('timerEnabled').addEventListener('change',e=>{state.timer=e.target.checked;save()})}
function weightedPick(list,count,preferReview=0){
 let arr=[...list];const rev=reviewIds();const recent=new Set(state.recent.slice(-25));
 let selected=[];
 const pickGroup=(p,num)=>{let g=p.filter(x=>!selected.includes(x));g.sort((a,b)=>((rev.has(b.id)?3:0)+(state.done[b.id]?0:2)+(b.priority==='good'?1:0)+(recent.has(b.id)?-2:0)+Math.random()*3)-((rev.has(a.id)?3:0)+(state.done[a.id]?0:2)+(a.priority==='good'?1:0)+(recent.has(a.id)?-2:0)+Math.random()*3));selected.push(...g.slice(0,num));};
 if(preferReview)pickGroup(arr.filter(x=>rev.has(x.id)),Math.min(count,preferReview));
 pickGroup(arr,count-selected.length);
 return selected.slice(0,count);
}
function start(mode='normal'){
 stopClock();state.mode=mode;let ms=QUESTIONS.filter(q=>q.type==='mc'),ws=QUESTIONS.filter(q=>q.type==='written');
 const forced=mode==='review'?10:4;
 const a=weightedPick(ms,6,mode==='review'?6:2),b=weightedPick(ws,4,mode==='review'?4:2);
 const selected=[...a,...b];const answer={};selected.forEach(q=>answer[q.id]='');
 current={selected,answer,graded:false,results:null,round:state.round+1};
 state.round++;state.recent.push(...selected.map(q=>q.id));state.recent=state.recent.slice(-100);save();secondsLeft=120;timerDeadline=Date.now()+120000;renderTest();if(state.timer){clockTimer=setInterval(tick,500);tick()}
}
function renderTest(){if(!current)return;const c=current;const score=c.results?c.results.filter(x=>x.ok).length:0;
 let h=`<section class="card"><div class="flex space"><div><span class="pill">第${c.round}セット</span><span class="pill">選択6問＋記述4問</span></div><div id="clock" class="clock ${secondsLeft<=30?'warn':''}">${state.timer?Math.floor(secondsLeft/60)+':'+String(secondsLeft%60).padStart(2,'0'):'時間制限なし'}</div></div>${c.graded?`<h2 style="margin-top:16px">採点結果：${score}/10点</h2><p class="muted">不正解は自動で復習リストに入りました。正解したけれど不安な問題は「怪しいので復習」をチェック。</p><p class="muted">受験回数：<b>${state.history.length}回</b>　｜　復習リスト：<b>${reviewIds().size}問</b></p><div class="flex" style="margin-top:12px">${btn('ホームに戻る','home','secondary')}${btn('学習履歴を保存','export','ghost')}</div>`:'<p class="muted" style="margin:11px 0 0">10問すべて答えたら採点。時間切れの場合は空欄も不正解になります。</p><div class="flex" style="margin-top:12px">'+btn('ホームに戻る','home','ghost')+'</div>'}</section>`;
 c.selected.forEach((q,i)=>{const r=c.graded?c.results[i]:null;const type=q.type==='mc'?'選択':'記述';h+=`<section class="card"><div class="flex space"><span class="pill">${i+1} / 10　${type}</span>${r?`<b class="${r.ok?'goodtext':'badtext'}">${r.ok?'○ 正解':'× 不正解'}</b>`:''}</div><div class="qtitle">${esc(q.q)}</div>`;
 if(q.type==='mc')h+='<div class="opts">'+q.options.map((opt,j)=>`<label class="opt"><input type="radio" name="ans_${q.id}" value="${esc(opt)}" ${c.answer[q.id]===opt?'checked':''} ${c.graded?'disabled':''}><span>${'①②③④'[j]}　${esc(opt)}</span></label>`).join('')+'</div>';
 else h+=`<input class="inp" type="text" name="ans_${q.id}" value="${esc(c.answer[q.id])}" placeholder="漢字で答える" autocomplete="off" ${c.graded?'disabled':''}>`;
 if(r){h+=`<div class="answerbox ${r.ok?'right':'wrong'}"><strong>${r.ok?'正解：':'正解は：'} ${esc(q.answer)}</strong>${r.ok?'':`<p>あなたの回答：${esc(r.given)||'（未回答）'}</p>`}<div class="exp"><strong>解説：</strong> ${esc(q.why)}</div></div><label class="check" style="margin-top:12px"><input type="checkbox" class="flag" data-id="${q.id}" ${state.flagged[q.id]?'checked':''}>怪しいので復習リストに残す</label>`;}
 h+='</section>';});
 h+=`<section class="card"><div class="flex">${c.graded?btn('次の10問へ','next'):btn('採点する','grade')}${c.graded?btn('復習中心の10問へ','revnext','secondary'):btn('いったん終了','home','ghost')}${c.graded?btn('復習リストを見る','list','ghost')+btn('ホームに戻る','home','secondary')+btn('学習履歴を保存','export','ghost'):''}</div>${c.graded?`<p class="muted" style="margin:12px 0 0">現在の復習リスト：<b>${reviewIds().size}問</b>　｜　正解済み：<b>${n(state.done)}/100問</b></p>`:''}</section>`;
 $('screen').innerHTML=h;bindCommon();if(!c.graded){c.selected.forEach(q=>{const name=`ans_${q.id}`;document.querySelectorAll(`[name="${name}"]`).forEach(el=>el.addEventListener('input',e=>{c.answer[q.id]=e.target.value}))})}else{document.querySelectorAll('.flag').forEach(el=>el.addEventListener('change',e=>{const id=e.target.dataset.id;if(e.target.checked)state.flagged[id]=true;else delete state.flagged[id];save();const count=document.querySelector('section.card:last-child .muted b');if(count)count.textContent=reviewIds().size}))}}
function grade(timed=false){if(!current||current.graded)return;stopClock();const c=current;const results=[];for(const q of c.selected){const given=c.answer[q.id]||'';const ok=q.type==='mc'?given===q.answer:[q.answer,...(q.aliases||[])].some(a=>norm(given)===norm(a));results.push({id:q.id,ok,given});if(ok){state.done[q.id]=true;delete state.missed[q.id]}else{state.missed[q.id]=true}}
 c.results=results;c.graded=true;const score=results.filter(x=>x.ok).length;state.history.push({round:c.round,score,missed:10-score,date:new Date().toLocaleString('ja-JP'),ids:results.map(x=>x.id)});save();renderTest();window.scrollTo({top:0,behavior:'smooth'});if(timed)toast('2分終了。自動採点しました。')}
function listView(){stopClock();const rev=reviewIds(),list=QUESTIONS.filter(q=>rev.has(q.id));$('screen').innerHTML=header()+`<section class="card"><h2>復習リスト　${list.length}問</h2><p class="muted">不正解は自動登録。正解したけど不安な問題も手動で追加できます。再テストで正解すれば不正解扱いは解除され、手動チェックを外せばリストから消えます。</p><div class="flex">${btn('復習中心で10問','review')}${btn('ホームに戻る','home','secondary')}</div></section>`+(list.length?list.map(q=>`<section class="card"><div class="flex space"><b>${q.id} · ${q.type==='mc'?'選択':'記述'}</b><span class="pill">${state.missed[q.id]?'誤答':'自己登録'}</span></div><p>${esc(q.q)}</p><p class="muted" style="font-size:14px">正解：${esc(q.answer)}</p><label class="check"><input class="flag" type="checkbox" data-id="${q.id}" ${state.flagged[q.id]?'checked':''}>自己登録として残す</label></section>`).join(''):'<section class="card"><p>復習リストは空です。新しい10問を解いてみよう！</p></section>');bindCommon();document.querySelectorAll('.flag').forEach(el=>el.addEventListener('change',e=>{const id=e.target.dataset.id;if(e.target.checked)state.flagged[id]=true;else delete state.flagged[id];save();listView()}))}
function exportData(){const payload={app:'古文文学史100問',exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='古文文学史100問_学習履歴.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('学習履歴を書き出しました')}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(String(r.result));if(data.app!=='古文文学史100問'||!data.state||typeof data.state.done!=='object')throw Error('format');if(!confirm('現在の履歴を読み込んだデータで置き換えます。よろしいですか？'))return;state=migrateQuestionBank({...fresh(),...data.state});save();dashboard();toast('学習履歴を読み込みました')}catch{alert('学習履歴のファイルとして読み込めませんでした')}};r.readAsText(file)}
function bindCommon(){document.querySelectorAll('[data-cmd]').forEach(el=>el.addEventListener('click',()=>{const cmd=el.dataset.cmd;if(cmd==='new'||cmd==='next')start('normal');else if(cmd==='review'||cmd==='revnext')start('review');else if(cmd==='grade')grade();else if(cmd==='list')listView();else if(cmd==='home'){if(current&&!current.graded&&!confirm('テストを途中終了してホームに戻りますか？ 未採点の回答は保存されません。'))return;dashboard();}else if(cmd==='export')exportData();else if(cmd==='import')$('importfile')?.click();}));$('importfile')?.addEventListener('change',e=>importData(e.target.files[0]))}
dashboard();
</script></body></html>
