<style>
:root{--ink:#162a36;--muted:#526779;--line:#d5e0e7;--bg:#f4f7f8;--card:#fff;--accent:#1c6973;--accent2:#e5f2f1;--good:#14764e;--bad:#b84739;--warn:#9d641d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;line-height:1.58}main{max-width:850px;margin:auto;padding:20px 15px 75px}
header{padding:23px 0 15px;border-bottom:1px solid var(--line);margin-bottom:22px}h1{margin:0;font-size:clamp(23px,4vw,31px);letter-spacing:.02em}h2{font-size:21px;margin:0 0 8px}h3{font-size:16px;margin:0 0 9px}.sub,.muted{color:var(--muted)}.sub{margin:5px 0 0}.flex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}.metric{border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px 10px}.metric b{display:block;font-size:26px;font-variant-numeric:tabular-nums}.metric small{font-size:12px;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:13px 0;box-shadow:0 1px 3px #1c2e3c09}button{background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:10px;padding:11px 14px;font-size:15px;font-weight:700;cursor:pointer}button:hover{filter:brightness(.95)}.toggle{display:block;margin-top:5px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #72b6c1;outline-offset:2px}button.secondary{color:var(--accent);background:#fff}button.ghost{color:var(--ink);background:#fff;border:1px solid var(--line)}button:disabled{opacity:.5;cursor:default}.tiny{padding:7px 9px;font-size:13px}.meter{height:10px;border-radius:9px;background:#dce9ed;overflow:hidden}.bar{height:100%;background:var(--accent);transition:width .3s}.pill{font-size:12px;color:var(--muted);background:#eef3f5;padding:3px 8px;border-radius:999px}.clock{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}.clock.warn{color:var(--bad)}.qtitle{font-size:17px;font-weight:700;line-height:1.5;margin:9px 0 13px}.opts{display:grid;gap:8px}.opt{display:flex;align-items:flex-start;gap:10px;border:1px solid var(--line);border-radius:9px;padding:9px 10px;cursor:pointer}.opt:has(input:checked){background:var(--accent2);border-color:#51a0a5}.opt input{accent-color:var(--accent);margin:5px 0 0;flex-shrink:0}.answerbox{border-radius:9px;padding:12px 13px;margin-top:12px}.right{background:#edf8f3;border-left:4px solid var(--good)}.wrong{background:#fff1ee;border-left:4px solid var(--bad)}.answerbox p{margin:5px 0}.exp{background:#fff;border:1px solid #ecc9c0;border-radius:8px;padding:10px 12px;margin-top:8px;font-size:14px}.inp{font:inherit;min-height:43px;width:100%;padding:9px 11px;border:1px solid #adbec8;border-radius:9px;background:#fff}.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px}.check input{width:18px;height:18px;accent-color:var(--accent)}.rule{border-top:1px solid var(--line);padding-top:14px;margin-top:15px}.notice{font-size:13px;line-height:1.6;border:1px solid var(--line);border-radius:11px;background:#fff;padding:12px 14px}.caption{font-size:12px;color:var(--muted)}.badtext{color:var(--bad)}.goodtext{color:var(--good)}.hidden{display:none !important}#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);max-width:90vw;background:#193541;color:white;border-radius:9px;padding:10px 15px;display:none;box-shadow:0 2px 18px #0002;z-index:20}.toggle{color:var(--accent);background:transparent;border:none;padding:6px 0;font-size:14px}.historyitem{border-top:1px solid var(--line);padding:9px 0;font-size:14px}.headingline{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.06em}select{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:15px}@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:14px}.qtitle{font-size:16px}main{padding:14px 12px 70px}.flex button{flex-grow:1}.metric b{font-size:24px}}@media print{body{background:white}button,.noshow{display:none!important}.card{break-inside:avoid;box-shadow:none}}

<body><main><header><div class="headingline">古文・文学史｜P319〜329</div><h1>100問トレーナー</h1><p class="sub">1回10問（選択6・記述4）／2分／自動採点／苦手を繰り返し</p></header><div id="screen"></div><p class="caption">出題の根拠：添付された文学史資料P319〜329。解説は正解・不正解のどちらでも採点後に表示されます。学習履歴はこのブラウザ内に保存されます。</p></main><div id="toast"></div><script>
'use strict';
const QUESTIONS = [{"id":"M001","type":"mc","q":"次のうち、現存する日本最古の書物はどれか。","options":["日本書紀","古事記","風土記","懐風藻"],"answer":"古事記","why":"『古事記』は712年に成立。『日本書紀』は720年。どちらも奈良時代だが、古事記の方が先。","priority":"good"},{"id":"M002","type":"mc","q":"次の作品のうち、成立時期が最も早いものはどれか。","options":["土佐日記","竹取物語","日本霊異記","源氏物語"],"answer":"日本霊異記","why":"『日本霊異記』は平安初期の説話集。『竹取物語』『土佐日記』より前に成立した。","priority":"good"},{"id":"M003","type":"mc","q":"日本最初の勅撰和歌集はどれか。","options":["万葉集","後撰和歌集","古今和歌集","新古今和歌集"],"answer":"古今和歌集","why":"『古今和歌集』は905年ごろ成立。『万葉集』は勅撰和歌集ではなく、最古の和歌集。","priority":"good"},{"id":"M004","type":"mc","q":"『古今和歌集』の撰者ではない人物はどれか。","options":["紀貫之","凡河内躬恒","紀友則","藤原定家"],"answer":"藤原定家","why":"藤原定家は『新古今和歌集』の撰者。『古今和歌集』の撰者には紀貫之・紀友則・凡河内躬恒・壬生忠岑がいる。","priority":"good"},{"id":"M005","type":"mc","q":"『万葉集』の代表的な歌人に含まれない人物はどれか。","options":["山部赤人","紀貫之","柿本人麻呂","大伴家持"],"answer":"紀貫之","why":"紀貫之は平安時代、『古今和歌集』の撰者。残りは『万葉集』の代表的歌人。","priority":"good"},{"id":"M006","type":"mc","q":"現存する日本最古の漢詩集はどれか。","options":["懐風藻","万葉集","古今和歌集","新古今和歌集"],"answer":"懐風藻","why":"『懐風藻』は751年成立の漢詩集。『万葉集』は和歌集で、ジャンルが違う。","priority":"good"},{"id":"M007","type":"mc","q":"現存する日本最古の和歌集はどれか。","options":["古今和歌集","万葉集","拾遺和歌集","後撰和歌集"],"answer":"万葉集","why":"『万葉集』は奈良時代の和歌集。最初の勅撰和歌集は『古今和歌集』なので区別する。","priority":"good"},{"id":"M008","type":"mc","q":"日本最初の正史とされる作品はどれか。","options":["古事記","日本書紀","日本霊異記","風土記"],"answer":"日本書紀","why":"『日本書紀』は720年に舎人親王らが編纂した、日本最初の正史。『古事記』は712年成立で、現存する日本最古の歴史書。成立は『古事記』のほうが早い。","priority":"good"},{"id":"M009","type":"mc","q":"『日本霊異記』のジャンルはどれか。","options":["日記","歴史物語","説話","軍記物語"],"answer":"説話","why":"『日本霊異記』は平安初期の仏教説話集。説話は個々の逸話を集めた文学。","priority":"good"},{"id":"M010","type":"mc","q":"『日本霊異記』の編者は誰か。","options":["景戒","紀貫之","紫式部","鴨長明"],"answer":"景戒","why":"『日本霊異記』は景戒が編んだ説話集。『今昔物語集』などとジャンルは同じだが成立時期は異なる。","priority":"good"},{"id":"M011","type":"mc","q":"次のうち、勅撰和歌集ではないものはどれか。","options":["後撰和歌集","古今和歌集","万葉集","拾遺和歌集"],"answer":"万葉集","why":"『万葉集』は最古の和歌集だが、天皇の命で編纂された勅撰和歌集ではない。","priority":"good"},{"id":"M012","type":"mc","q":"成立順として正しいものはどれか。","options":["日本書紀→古事記→万葉集→古今和歌集","古事記→日本書紀→万葉集→古今和歌集","万葉集→古事記→日本書紀→古今和歌集","古事記→古今和歌集→日本書紀→万葉集"],"answer":"古事記→日本書紀→万葉集→古今和歌集","why":"古事記712年、日本書紀720年、万葉集は8世紀後半までに編纂、古今和歌集は905年ごろ。","priority":"good"},{"id":"M013","type":"mc","q":"『竹取物語』のジャンルとして適切なものはどれか。","options":["作り物語","歌物語","歴史物語","軍記物語"],"answer":"作り物語","why":"『竹取物語』は物語文学の祖とされる作り物語。『伊勢物語』は歌物語。","priority":"good"},{"id":"M014","type":"mc","q":"『伊勢物語』のジャンルはどれか。","options":["歴史物語","説話","歌物語","日記"],"answer":"歌物語","why":"『伊勢物語』は和歌と物語を組み合わせる歌物語。『大和物語』も歌物語。","priority":"good"},{"id":"M015","type":"mc","q":"『伊勢物語』の主人公のモデルとされる歌人は誰か。","options":["小野小町","在原業平","藤原定家","西行"],"answer":"在原業平","why":"『伊勢物語』は在原業平をモデルにした歌物語。平安前期の文学。","priority":"good"},{"id":"M016","type":"mc","q":"『伊勢物語』と同じジャンルの作品はどれか。","options":["大和物語","竹取物語","栄花物語","平家物語"],"answer":"大和物語","why":"『伊勢物語』『大和物語』は歌物語。『竹取物語』は作り物語、『栄花物語』は歴史物語。","priority":"good"},{"id":"M017","type":"mc","q":"『枕草子』と同じジャンルの作品はどれか。","options":["更級日記","方丈記","宇治拾遺物語","平家物語"],"answer":"方丈記","why":"『枕草子』『方丈記』『徒然草』は日本三大随筆。『更級日記』は日記。","priority":"good"},{"id":"M018","type":"mc","q":"『源氏物語』の全巻数は何帖か。","options":["十帖","二十帖","五十四帖","百帖"],"answer":"五十四帖","why":"『源氏物語』は全54帖。最後の10帖を「宇治十帖」と呼ぶ。","priority":"normal"},{"id":"M019","type":"mc","q":"『源氏物語』の最後の十帖を何と呼ぶか。","options":["宇治十帖","須磨十帖","大和十帖","竹取十帖"],"answer":"宇治十帖","why":"最後の十帖は「宇治十帖」。源氏物語全体は54帖である。","priority":"normal"},{"id":"M020","type":"mc","q":"『蜻蛉日記』の作者は誰か。","options":["藤原道綱母","紫式部","清少納言","阿仏尼"],"answer":"藤原道綱母","why":"『蜻蛉日記』は藤原道綱母の作。平安時代の女流日記文学。","priority":"good"},{"id":"M021","type":"mc","q":"『更級日記』の作者は誰か。","options":["藤原道綱母","菅原孝標女","和泉式部","清少納言"],"answer":"菅原孝標女","why":"『更級日記』は菅原孝標女の作。『蜻蛉日記』の作者は藤原道綱母。","priority":"good"},{"id":"M022","type":"mc","q":"『土佐日記』の作者は誰か。","options":["在原業平","紀貫之","藤原定家","鴨長明"],"answer":"紀貫之","why":"『土佐日記』は紀貫之の作。男性作者が女性に仮託し、仮名で書いた日記。","priority":"normal"},{"id":"M023","type":"mc","q":"『土佐日記』の特徴として正しいものはどれか。","options":["藤原道長の栄華を編年体で描く","仮名で、女性に仮託して記す","後鳥羽院の命で編まれた","源平合戦を描く"],"answer":"仮名で、女性に仮託して記す","why":"『土佐日記』の作者は紀貫之。男性が女性の立場で書くという設定が特徴。","priority":"good"},{"id":"M024","type":"mc","q":"『栄花物語』のジャンルはどれか。","options":["軍記物語","歴史物語","歌物語","説話"],"answer":"歴史物語","why":"『栄花物語』は藤原道長らの栄華を編年体で描く歴史物語。『大鏡』も歴史物語。","priority":"good"},{"id":"M025","type":"mc","q":"『大鏡』が主に描く人物・時代はどれか。","options":["藤原道長らの栄華","源義経の戦い","足利尊氏の南北朝時代","徳川家康の幕府創設"],"answer":"藤原道長らの栄華","why":"『大鏡』は藤原北家の歴史、とくに道長の栄華を中心に描く歴史物語。","priority":"good"},{"id":"M026","type":"mc","q":"『大鏡』と同じジャンルの作品はどれか。","options":["宇治拾遺物語","今昔物語集","水鏡","方丈記"],"answer":"水鏡","why":"『大鏡』『水鏡』『増鏡』は歴史物語。「鏡」の名がつく四鏡はまとめて覚える。","priority":"normal"},{"id":"M027","type":"mc","q":"『源氏物語』と成立時期が近い勅撰和歌集はどれか。","options":["新古今和歌集","拾遺和歌集","金葉和歌集","古今和歌集"],"answer":"拾遺和歌集","why":"『源氏物語』は11世紀初め、『拾遺和歌集』も11世紀初めごろ。『古今和歌集』は約100年前。","priority":"normal"},{"id":"M028","type":"mc","q":"『源氏物語』より前に成立した作品はどれか。","options":["栄花物語","更級日記","竹取物語","大鏡"],"answer":"竹取物語","why":"『竹取物語』は平安前期。『源氏物語』は11世紀初め、『更級日記』『大鏡』はそれ以降。","priority":"normal"},{"id":"M029","type":"mc","q":"次のうち、清少納言が仕えたのは誰か。","options":["中宮彰子","中宮定子","後鳥羽院","紫式部"],"answer":"中宮定子","why":"清少納言は中宮定子に、紫式部は中宮彰子に仕えた。二人の混同に注意。","priority":"good"},{"id":"M030","type":"mc","q":"紫式部が仕えたのは誰か。","options":["中宮定子","中宮彰子","後白河院","藤原道綱母"],"answer":"中宮彰子","why":"紫式部は中宮彰子に仕え、『源氏物語』を著した。定子に仕えたのは清少納言。","priority":"good"},{"id":"M031","type":"mc","q":"『和泉式部日記』の作者は誰か。","options":["菅原孝標女","和泉式部","藤原道綱母","赤染衛門"],"answer":"和泉式部","why":"『和泉式部日記』は和泉式部の作。『更級日記』は菅原孝標女。","priority":"normal"},{"id":"M032","type":"mc","q":"『古今和歌集』の仮名序を書いたのは誰か。","options":["紀貫之","藤原定家","源実朝","西行"],"answer":"紀貫之","why":"紀貫之は『古今和歌集』の撰者で、和歌論として重要な仮名序の執筆者。","priority":"good"},{"id":"M033","type":"mc","q":"『栄花物語』の記述方法として適切なものはどれか。","options":["編年体","対話体のみ","和歌のみ","俳句のみ"],"answer":"編年体","why":"『栄花物語』は出来事を年代順に追う編年体の歴史物語。『大鏡』とは叙述スタイルが異なる。","priority":"good"},{"id":"M034","type":"mc","q":"次のうち、平安時代の女流日記文学に含まれないものはどれか。","options":["更級日記","蜻蛉日記","和泉式部日記","方丈記"],"answer":"方丈記","why":"『方丈記』は鎌倉時代の鴨長明による随筆。残りは平安時代の日記文学。","priority":"good"},{"id":"M035","type":"mc","q":"『新古今和歌集』の撰者の一人は誰か。","options":["紀貫之","柿本人麻呂","藤原定家","松尾芭蕉"],"answer":"藤原定家","why":"藤原定家は鎌倉時代の『新古今和歌集』撰者。紀貫之は『古今和歌集』。","priority":"good"},{"id":"M036","type":"mc","q":"『新古今和歌集』の編纂を命じたのは誰か。","options":["後鳥羽院","後白河院","醍醐天皇","源実朝"],"answer":"後鳥羽院","why":"『新古今和歌集』は後鳥羽院の命で編纂され1205年ごろ成立。『古今和歌集』は醍醐天皇の命。","priority":"good"},{"id":"M037","type":"mc","q":"『方丈記』の作者は誰か。","options":["兼好法師","鴨長明","世阿弥","源実朝"],"answer":"鴨長明","why":"『方丈記』は鴨長明の随筆。『徒然草』は兼好法師。","priority":"good"},{"id":"M038","type":"mc","q":"『方丈記』の冒頭に当たるものはどれか。","options":["つれづれなるままに","祇園精舎の鐘の声","ゆく河の流れは絶えずして","春はあけぼの"],"answer":"ゆく河の流れは絶えずして","why":"『方丈記』の冒頭は「ゆく河の流れは絶えずして」。『徒然草』は「つれづれなるままに」。","priority":"good"},{"id":"M039","type":"mc","q":"『徒然草』の冒頭に当たるものはどれか。","options":["春はあけぼの","つれづれなるままに","祇園精舎の鐘の声","男もすなる日記といふものを"],"answer":"つれづれなるままに","why":"『徒然草』は兼好法師の随筆。『方丈記』と並べて冒頭を識別する。","priority":"good"},{"id":"M040","type":"mc","q":"『平家物語』の冒頭に当たるものはどれか。","options":["祇園精舎の鐘の声","春はあけぼの","ゆく河の流れは絶えずして","つれづれなるままに"],"answer":"祇園精舎の鐘の声","why":"『平家物語』は軍記物語。冒頭は無常観を印象づける「祇園精舎の鐘の声」。","priority":"good"},{"id":"M041","type":"mc","q":"『平家物語』と同じジャンルの作品はどれか。","options":["保元物語","落窪物語","伊勢物語","栄花物語"],"answer":"保元物語","why":"『平家物語』『保元物語』『平治物語』は軍記物語。『栄花物語』は歴史物語。","priority":"good"},{"id":"M042","type":"mc","q":"『金槐和歌集』の作者は誰か。","options":["西行","源実朝","藤原定家","後白河院"],"answer":"源実朝","why":"『金槐和歌集』は鎌倉幕府3代将軍・源実朝の私家集。『山家集』は西行。","priority":"good"},{"id":"M043","type":"mc","q":"『山家集』の作者は誰か。","options":["西行","鴨長明","源実朝","藤原俊成"],"answer":"西行","why":"『山家集』は西行の私家集。源実朝は『金槐和歌集』。","priority":"normal"},{"id":"M044","type":"mc","q":"『梁塵秘抄』を編んだ人物は誰か。","options":["後白河院","後鳥羽院","紀貫之","二条良基"],"answer":"後白河院","why":"『梁塵秘抄』は後白河院による今様（歌謡）の集成。後鳥羽院は『新古今和歌集』の編纂を命じた。","priority":"good"},{"id":"M045","type":"mc","q":"『宇治拾遺物語』のジャンルはどれか。","options":["随筆","説話","日記","軍記物語"],"answer":"説話","why":"『宇治拾遺物語』は鎌倉時代の説話集。『日本霊異記』『今昔物語集』も説話に分類される。","priority":"good"},{"id":"M046","type":"mc","q":"『十六夜日記』の作者は誰か。","options":["清少納言","阿仏尼","菅原孝標女","藤原道綱母"],"answer":"阿仏尼" good"},{"id":"W025","type":"written","q":"『十六夜日記』の作者を答えよ。","answer":"阿仏尼","aliases":[],"why":"鎌倉時代の日記。平安時代の『更級日記』の作者は菅原孝標女。","priority":"good"},{"id":"W026","type":"written","q":"鎌倉時代に成立した、「宇治」の地名を冠する説話集を答えよ。","answer":"宇治拾遺物語","aliases":[],"why":"『宇治拾遺物語』は説話集。『今昔物語集』も説話集だが平安後期の作品。","priority":"good"},{"id":"W027","type":"written","q":"『大鏡』『今鏡』『水鏡』『増鏡』のうち、成立が最も早い作品を答えよ。","answer":"大鏡","aliases":[],"why":"四鏡の中では『大鏡』が最初。順序は大鏡→今鏡→水鏡→増鏡と覚える。","priority":"good"},{"id":"W028","type":"written","q":"藤原道長らの栄華を中心に描く、平安後期の歴史物語の題名を答えよ。","answer":"大鏡","aliases":[],"why":"『大鏡』は歴史物語。『栄花物語』も道長の栄華を描くが、こちらは編年体。","priority":"good"},{"id":"W029","type":"written","q":"鎌倉時代後期〜南北朝期に成立し、「四鏡」の最後に当たる歴史物語を答えよ。","answer":"増鏡","aliases":[],"why":"四鏡は大鏡・今鏡・水鏡・増鏡。『増鏡』は鎌倉期の歴史を扱う。","priority":"good"},{"id":"W030","type":"written","q":"南北朝の争乱を描いた、14世紀の代表的な軍記物語を答えよ。","answer":"太平記","aliases":[],"why":"『太平記』は軍記物語。『平家物語』は鎌倉時代の軍記物語。","priority":"good"},{"id":"W031","type":"written","q":"『菟玖波集』の撰者を答えよ。","answer":"二条良基","aliases":[],"why":"『菟玖波集』は二条良基。『新撰菟玖波集』は飯尾宗祇。名前が似ているので注意。","priority":"good"},{"id":"W032","type":"written","q":"『新撰菟玖波集』の撰者を答えよ。","answer":"飯尾宗祇","aliases":[],"why":"「新撰」がある方は飯尾宗祇。「新撰」がない『菟玖波集』は二条良基。","priority":"good"},{"id":"W033","type":"written","q":"能楽論書『風姿花伝』の作者を答えよ。","answer":"世阿弥","aliases":[],"why":"世阿弥は能を大成した人物。『風姿花伝』は能楽論書。","priority":"good"},{"id":"W034","type":"written","q":"俳諧紀行文『奥の細道』の作者を答えよ。","answer":"松尾芭蕉","aliases":[],"why":"『奥の細道』の作者は松尾芭蕉。『笈の小文』も芭蕉による俳諧紀行文。","priority":"normal"},{"id":"W035","type":"written","q":"江戸時代の国学者で、『玉勝間』を著した人物を答えよ。","answer":"本居宣長","aliases":[],"why":"『玉勝間』は江戸時代の国学者・本居宣長の随筆。『古事記伝』も本居宣長の著作。","priority":"good"},{"id":"W036","type":"written","q":"読本『雨月物語』の作者を答えよ。","answer":"上田秋成","aliases":[],"why":"『雨月物語』は上田秋成の読本。『南総里見八犬伝』は滝沢馬琴。","priority":"good"},{"id":"W037","type":"written","q":"浄瑠璃『曽根崎心中』『国性爺合戦』の作者を答えよ。","answer":"近松門左衛門","aliases":[],"why":"近松門左衛門は浄瑠璃作家。井原西鶴は『好色一代男』などの浮世草子。","priority":"good"},{"id":"W038","type":"written","q":"滑稽本『東海道中膝栗毛』の作者を答えよ。","answer":"十返舎一九","aliases":[],"why":"『東海道中膝栗毛』は十返舎一九。『浮世風呂』は式亭三馬。","priority":"good"},{"id":"W039","type":"written","q":"滑稽本『浮世風呂』の作者を答えよ。","answer":"式亭三馬","aliases":[],"why":"江戸後期の滑稽本。『東海道中膝栗毛』は十返舎一九。","priority":"good"},{"id":"W040","type":"written","q":"江戸時代の俳人で、『新花摘』の作者を答えよ。","answer":"与謝蕪村","aliases":[],"why":"『新花摘』は与謝蕪村の俳諧作品。『奥の細道』の松尾芭蕉と区別する。","priority":"good"}];
const KEY='kobun100v1';
const S=(k,def)=>{try{const x=JSON.parse(localStorage.getItem(k));return x??def}catch{return def}};
const fresh=()=>({version:1,done:{},missed:{},flagged:{},recent:[],history:[],round:0,mode:'normal',timer:true});
let state={...fresh(),...S(KEY,fresh())};
let current=null; let clockTimer=null; let secondsLeft=120; let timerDeadline=0;
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=x=>String(x||'').normalize('NFKC').replace(/[\s\u3000・･「」『』（）()]/g,'').trim();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
const btn=(txt,func,cls='')=>`<button type="button" class="${cls}" data-cmd="${func}">${txt}</button>`;
const n=x=>Object.keys(x).length;
const qby=id=>QUESTIONS.find(x=>x.id===id);
const reviewIds=()=>new Set([...Object.keys(state.missed),...Object.keys(state.flagged)]);
const stats=()=>({done:n(state.done),wrong:reviewIds().size,missed:n(state.missed),flagged:n(state.flagged),total:QUESTIONS.length});
function toast(msg){const el=$('toast');el.textContent=msg;el.style.display='block';setTimeout(()=>{el.style.display='none'},2500)}
function stopClock(){if(clockTimer){clearInterval(clockTimer);clockTimer=null}}
function tick(){if(!current||current.graded||!state.timer)return;secondsLeft=Math.max(0,Math.ceil((timerDeadline-Date.now())/1000));const el=$('clock');if(el){el.textContent=Math.floor(secondsLeft/60)+':'+String(secondsLeft%60).padStart(2,'0');el.classList.toggle('warn',secondsLeft<=30)}if(secondsLeft<=0){stopClock();grade(true)}}
function header(){const st=stats();return `<div class="grid"><div class="metric"><b>${st.done}<small> / 100</small></b><small>正解済み</small></div><div class="metric"><b>${st.wrong}</b><small>復習リスト</small></div><div class="metric"><b>${st.missed}</b><small>まだ解き直していない誤答</small></div><div class="metric"><b>${state.history.length}</b><small>受験セット数</small></div></div><div class="meter"><div class="bar" style="width:${st.done}%"></div></div>`}
function dashboard(){stopClock();current=null;const st=stats();const last=state.history.slice(-3).reverse();$('screen').innerHTML=header()+`<section class="card"><h2>${st.done===100&&st.wrong===0?'100問達成！おめでとう！':'10問ずつ進めよう'}</h2><p class="muted">まずは未正解の問題を優先。復習リストがあれば、次のテストに何問か混ぜます。復習リストは現在<strong>${st.wrong}問</strong>。</p><div class="flex" style="margin:16px 0">${btn('新しい10問を開始','new')}${btn('復習中心で10問','review','secondary')}${btn('復習リストを見る','list','ghost')}</div><label class="check"><input type="checkbox" id="timerEnabled" ${state.timer?'checked':''}>2分タイマーを使う（時間切れで自動採点）</label></section><section class="card"><h3>このアプリの採点ルール</h3><p class="muted">正解・不正解のどちらも、採点後に答えと解説を表示します。不正解は自動で復習リストに登録します。正解した問題も「怪しいので復習」で手動登録可能。復習問題を正解し、自信ありにしたらリストから外れます。</p><p class="muted">回答を空欄にすると不正解です。記述は空白や一部の記号の違いは無視しますが、正しい漢字が必要です。</p></section><section class="card"><h3>最近の結果</h3>${last.length?last.map(x=>`<div class="historyitem">第${x.round}セット：<b>${x.score}/10</b>点 · 誤答${x.missed}問 · ${esc(x.date)}</div>`).join(''):'<p class="muted">まだ受験履歴がありません。</p>'}<div class="rule flex">${btn('履歴を書き出す','export','secondary tiny')}${btn('履歴を読み込む','import','ghost tiny')}<input type="file" accept="application/json" id="importfile" class="hidden"><span class="caption">端末変更やブラウザのデータ消去に備えて保存できます。</span></div></section>`;bindCommon();$('timerEnabled').addEventListener('change',e=>{state.timer=e.target.checked;save()})}
function weightedPick(list,count,preferReview=0){
 let arr=[...list];const rev=reviewIds();const recent=new Set(state.recent.slice(-25));
 let selected=[];
 const pickGroup=(p,num)=>{let g=p.filter(x=>!selected.includes(x));g.sort((a,b)=>((rev.has(b.id)?3:0)+(state.done[b.id]?0:2)+(b.priority==='good'?1:0)+(recent.has(b.id)?-2:0)+Math.random()*3)-((rev.has(a.id)?3:0)+(state.done[a.id]?0:2)+(a.priority==='good'?1:0)+(recent.has(a.id)?-2:0)+Math.random()*3));selected.push(...g.slice(0,num));};
 if(preferReview)pickGroup(arr.filter(x=>rev.has(x.id)),Math.min(count,preferReview));
 pickGroup(arr,count-selected.length);
 return selected.slice(0,count);
}
function start(mode='normal'){
 stopClock();state.mode=mode;let ms=QUESTIONS.filter(q=>q.type==='mc'),ws=QUESTIONS.filter(q=>q.type==='written');
 const forced=mode==='review'?10:4;
 const a=weightedPick(ms,6,mode==='review'?6:2),b=weightedPick(ws,4,mode==='review'?4:2);
 const selected=[...a,...b];const answer={};selected.forEach(q=>answer[q.id]='');
 current={selected,answer,graded:false,results:null,round:state.round+1};
 state.round++;state.recent.push(...selected.map(q=>q.id));state.recent=state.recent.slice(-100);save();secondsLeft=120;timerDeadline=Date.now()+120000;renderTest();if(state.timer){clockTimer=setInterval(tick,500);tick()}
}
function renderTest(){if(!current)return;const c=current;const score=c.results?c.results.filter(x=>x.ok).length:0;
 let h=`<section class="card"><div class="flex space"><div><span class="pill">第${c.round}セット</span><span class="pill">選択6問＋記述4問</span></div><div id="clock" class="clock ${secondsLeft<=30?'warn':''}">${state.timer?Math.floor(secondsLeft/60)+':'+String(secondsLeft%60).padStart(2,'0'):'時間制限なし'}</div></div>${c.graded?`<h2 style="margin-top:16px">採点結果：${score}/10点</h2><p class="muted">不正解は自動で復習リストに入りました。正解したけれど不安な問題は「怪しいので復習」をチェック。</p><p class="muted">受験回数：<b>${state.history.length}回</b>　｜　復習リスト：<b>${reviewIds().size}問</b></p><div class="flex" style="margin-top:12px">${btn('ホームに戻る','home','secondary')}${btn('学習履歴を保存','export','ghost')}</div>`:'<p class="muted" style="margin:11px 0 0">10問すべて答えたら採点。時間切れの場合は空欄も不正解になります。</p><div class="flex" style="margin-top:12px">'+btn('ホームに戻る','home','ghost')+'</div>'}</section>`;
 c.selected.forEach((q,i)=>{const r=c.graded?c.results[i]:null;const type=q.type==='mc'?'選択':'記述';h+=`<section class="card"><div class="flex space"><span class="pill">${i+1} / 10　${type}</span>${r?`<b class="${r.ok?'goodtext':'badtext'}">${r.ok?'○ 正解':'× 不正解'}</b>`:''}</div><div class="qtitle">${esc(q.q)}</div>`;
 if(q.type==='mc')h+='<div class="opts">'+q.options.map((opt,j)=>`<label class="opt"><input type="radio" name="ans_${q.id}" value="${esc(opt)}" ${c.answer[q.id]===opt?'checked':''} ${c.graded?'disabled':''}><span>${'①②③④'[j]}　${esc(opt)}</span></label>`).join('')+'</div>';
 else h+=`<input class="inp" type="text" name="ans_${q.id}" value="${esc(c.answer[q.id])}" placeholder="漢字で答える" autocomplete="off" ${c.graded?'disabled':''}>`;
 if(r){h+=`<div class="answerbox ${r.ok?'right':'wrong'}"><strong>${r.ok?'正解：':'正解は：'} ${esc(q.answer)}</strong>${r.ok?'':`<p>あなたの回答：${esc(r.given)||'（未回答）'}</p>`}<div class="exp"><strong>解説：</strong> ${esc(q.why)}</div></div><label class="check" style="margin-top:12px"><input type="checkbox" class="flag" data-id="${q.id}" ${state.flagged[q.id]?'checked':''}>怪しいので復習リストに残す</label>`;}
 h+='</section>';});
 h+=`<section class="card"><div class="flex">${c.graded?btn('次の10問へ','next'):btn('採点する','grade')}${c.graded?btn('復習中心の10問へ','revnext','secondary'):btn('いったん終了','home','ghost')}${c.graded?btn('復習リストを見る','list','ghost')+btn('ホームに戻る','home','secondary')+btn('学習履歴を保存','export','ghost'):''}</div>${c.graded?`<p class="muted" style="margin:12px 0 0">現在の復習リスト：<b>${reviewIds().size}問</b>　｜　正解済み：<b>${n(state.done)}/100問</b></p>`:''}</section>`;
 $('screen').innerHTML=h;bindCommon();if(!c.graded){c.selected.forEach(q=>{const name=`ans_${q.id}`;document.querySelectorAll(`[name="${name}"]`).forEach(el=>el.addEventListener('input',e=>{c.answer[q.id]=e.target.value}))})}else{document.querySelectorAll('.flag').forEach(el=>el.addEventListener('change',e=>{const id=e.target.dataset.id;if(e.target.checked)state.flagged[id]=true;else delete state.flagged[id];save();const count=document.querySelector('section.card:last-child .muted b');if(count)count.textContent=reviewIds().size}))}}
function grade(timed=false){if(!current||current.graded)return;stopClock();const c=current;const results=[];for(const q of c.selected){const given=c.answer[q.id]||'';const ok=q.type==='mc'?given===q.answer:[q.answer,...(q.aliases||[])].some(a=>norm(given)===norm(a));results.push({id:q.id,ok,given});if(ok){state.done[q.id]=true;delete state.missed[q.id]}else{state.missed[q.id]=true}}
 c.results=results;c.graded=true;const score=results.filter(x=>x.ok).length;state.history.push({round:c.round,score,missed:10-score,date:new Date().toLocaleString('ja-JP'),ids:results.map(x=>x.id)});save();renderTest();window.scrollTo({top:0,behavior:'smooth'});if(timed)toast('2分終了。自動採点しました。')}
function listView(){stopClock();const rev=reviewIds(),list=QUESTIONS.filter(q=>rev.has(q.id));$('screen').innerHTML=header()+`<section class="card"><h2>復習リスト　${list.length}問</h2><p class="muted">不正解は自動登録。正解したけど不安な問題も手動で追加できます。再テストで正解すれば不正解扱いは解除され、手動チェックを外せばリストから消えます。</p><div class="flex">${btn('復習中心で10問','review')}${btn('ホームに戻る','home','secondary')}</div></section>`+(list.length?list.map(q=>`<section class="card"><div class="flex space"><b>${q.id} · ${q.type==='mc'?'選択':'記述'}</b><span class="pill">${state.missed[q.id]?'誤答':'自己登録'}</span></div><p>${esc(q.q)}</p><p class="muted" style="font-size:14px">正解：${esc(q.answer)}</p><label class="check"><input class="flag" type="checkbox" data-id="${q.id}" ${state.flagged[q.id]?'checked':''}>自己登録として残す</label></section>`).join(''):'<section class="card"><p>復習リストは空です。新しい10問を解いてみよう！</p></section>');bindCommon();document.querySelectorAll('.flag').forEach(el=>el.addEventListener('change',e=>{const id=e.target.dataset.id;if(e.target.checked)state.flagged[id]=true;else delete state.flagged[id];save();listView()}))}
function exportData(){const payload={app:'古文文学史100問',exportedAt:new Date().toISOString(),state};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='古文文学史100問_学習履歴.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('学習履歴を書き出しました')}
function importData(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(String(r.result));if(data.app!=='古文文学史100問'||!data.state||typeof data.state.done!=='object')throw Error('format');if(!confirm('現在の履歴を読み込んだデータで置き換えます。よろしいですか？'))return;state={...fresh(),...data.state};save();dashboard();toast('学習履歴を読み込みました')}catch{alert('学習履歴のファイルとして読み込めませんでした')}};r.readAsText(file)}
function bindCommon(){document.querySelectorAll('[data-cmd]').forEach(el=>el.addEventListener('click',()=>{const cmd=el.dataset.cmd;if(cmd==='new'||cmd==='next')start('normal');else if(cmd==='review'||cmd==='revnext')start('review');else if(cmd==='grade')grade();else if(cmd==='list')listView();else if(cmd==='home'){if(current&&!current.graded&&!confirm('テストを途中終了してホームに戻りますか？ 未採点の回答は保存されません。'))return;dashboard();}else if(cmd==='export')exportData();else if(cmd==='import')$('importfile')?.click();}));$('importfile')?.addEventListener('change',e=>importData(e.target.files[0]))}
dashboard();
</script></body></html>
